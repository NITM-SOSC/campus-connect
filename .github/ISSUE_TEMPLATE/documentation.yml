name: Documentation improvement
description: Suggest a correction, clarification, or addition to project documentation
labels: [documentation]
body:
  - type: textarea
    id: location
    attributes:
      label: Which document or section is this about?
      description: Link or name the file and section, if known.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
      description: Explain what is unclear, missing, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe a possible correction or improvement.
    validations:
      required: false
